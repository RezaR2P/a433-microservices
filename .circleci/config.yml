version: 2.1

jobs:
  lint-dockerfile:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            sudo apt-get update && sudo apt-get install -y wget
            wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
            chmod +x hadolint
            sudo mv hadolint /usr/local/bin/
      - run:
          name: Run hadolint
          command: hadolint Dockerfile

  build-app-karsajobs-ui:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to GitHub Container Registry
          command: echo $CR_PAT | docker login ghcr.io -u $GHCR_USER --password-stdin
      - run:
          name: Build Docker image
          command: docker build -t ghcr.io/$GHCR_USER/karsajobs-ui:latest .
      - run:
          name: Push Docker image
          command: docker push ghcr.io/$GHCR_USER/karsajobs-ui:latest

workflows:
  version: 2
  karsajobs-ui-ci:
    jobs:
      - lint-dockerfile
      - build-app-karsajobs-ui:
          requires:
            - lint-dockerfile
