version: 2.1

executors:
  golang-executor:
    docker:
      - image: cimg/go:1.21

jobs:
  lint-dockerfile:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install hadolint
          command: |
            sudo apt-get update && sudo apt-get install -y wget
            wget -O hadolint [https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64](https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64)
            chmod +x hadolint
            sudo mv hadolint /usr/local/bin/
      - run:
          name: Run hadolint
          command: hadolint Dockerfile

  test-app:
    executor: golang-executor
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Login to GitHub Container Registry
          command: echo $CR_PAT | docker login ghcr.io -u $GHCR_USER --password-stdin
      - run:
          name: Build Docker image
          command: docker build -t ghcr.io/$GHCR_USER/karsajobs:latest .
      - run:
          name: Push Docker image
          command: docker push ghcr.io/$GHCR_USER/karsajobs:latest

workflows:
  version: 2
  karsajobs-ci:
    jobs:
      - lint-dockerfile
      - test-app
      - build-app-karsajobs:
          requires:
            - lint-dockerfile
            - test-app
